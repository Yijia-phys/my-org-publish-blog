<style>
  /* ============================================================
     404 page styles.
     Design tokens (colors, fonts) come from /style.css — always
     use var(--...) here instead of hardcoding values, so dark
     mode, fonts and the accent color stay in sync with the site.
     ============================================================ */

  /* Local accents that the site tokens don't provide. */
  :root {
    --404-gold:    #f6ad55;
    --card-shadow: 0 2px 16px rgba(20, 22, 40, .07);
  }

  :root[data-resolved="dark"] {
    --404-gold:    #fbbf77;
    --card-shadow: 0 2px 24px rgba(0, 0, 0, .4);
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .error-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .error-card {
    background: var(--fill);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    box-shadow: var(--card-shadow);
    padding: 3rem 3.5rem 2.6rem;
    max-width: 480px;
    width: 100%;
    text-align: center;
  }

  /* Pendulum figure — colors driven by CSS variables. */

  .pendulum-wrap {
    height: 140px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    margin-bottom: 1.8rem;
  }

  .pendulum-guide  { stroke: var(--hairline); }
  #pivot-dot       { fill: var(--primary); transition: fill 1s ease; }
  #arm line        { stroke: var(--text); stroke-width: 2; stroke-linecap: round; }
  #bob             { fill: var(--primary); transition: fill 1s ease; }
  .pendulum-arc    { fill: none; stroke: var(--hairline); stroke-dasharray: 3 2; }
  .pendulum-theta  { fill: var(--primary); }

  /* Bob turns gold once the pendulum settles. */
  body.error-stopped #bob,
  body.error-stopped #pivot-dot { fill: var(--404-gold); }

  /* Easter egg: fades in when the pendulum stops. */
  .egg {
    opacity: 0;
    transition: opacity 1.4s ease;
    font-family: var(--font-serif);
    font-style: italic;
    font-size: .82rem;
    color: var(--404-gold);
    margin: -.8rem 0 1.2rem;
    letter-spacing: .01em;
  }
  .egg sub { font-size: .65em; }
  body.error-stopped .egg { opacity: 1; }

  /* Text */

  .error-code {
    font-family: var(--font-serif);
    font-size: 4.8rem;
    font-weight: 300;
    color: var(--primary);
    line-height: 1;
    letter-spacing: -.02em;
    margin-bottom: .1em;
  }

  .error-title {
    font-family: var(--font-serif);
    font-size: 1.2rem;
    font-weight: 400;
    margin-bottom: .75rem;
  }

  .error-desc {
    font-size: .88rem;
    color: var(--muted);
    line-height: 1.8;
    margin-bottom: .4rem;
  }

  .error-eq {
    display: inline-block;
    font-family: var(--font-serif);
    font-style: italic;
    font-size: .9rem;
    color: var(--primary);
    background: var(--tint);
    border-radius: 4px;
    padding: .25em .85em;
    margin: .65rem 0 1.8rem;
  }

  .error-divider {
    width: 28px;
    height: 1px;
    background: var(--hairline);
    margin: 0 auto 1.6rem;
  }

  .error-btn {
    display: inline-flex;
    align-items: center;
    gap: .45rem;
    background: var(--primary);
    color: var(--fill);
    text-decoration: none;
    font-size: .875rem;
    padding: .6em 1.7em;
    border-radius: 6px;
    transition: filter .15s ease, box-shadow .15s ease;
  }
  .error-btn:hover {
    color: var(--fill);
    filter: brightness(.94);
    box-shadow: 0 4px 12px var(--scrim);
  }
  .error-btn svg { width: 13px; height: 13px; fill: currentColor; }

  .error-footnote {
    font-size: .7rem;
    color: var(--muted);
    opacity: .75;
    margin-top: 2rem;
    font-style: italic;
  }

  /* Narrow screens */

  @media (max-width: 640px) {
    .error-card { padding: 2.4rem 1.5rem 2.2rem; }
  }

  /* Reduced motion: skip the animation entirely. */
  @media (prefers-reduced-motion: reduce) {
    .egg { transition: none; }
  }
</style>

<script>
  // Pendulum physics (rAF). No hardcoded colors here: the "settled"
  // gold state is a class on <body>, and the stylesheet maps it to
  // CSS variables — so dark mode and the easter egg stay in sync.
  (function () {
    var arm = document.getElementById('arm');
    var angle = -28;   // degrees, starts left
    var vel = 0.13;    // initial kick
    var last = null;
    var stopped = false;

    // Respect reduced-motion: settle instantly.
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.body.classList.add('error-stopped');
      return;
    }

    function tick(ts) {
      if (last !== null) {
        var dt = Math.min(ts - last, 40) / 1000; // seconds, capped at 40ms
        // Simple harmonic approximation: α = -(g/l)*θ (small-angle, but feels right)
        var acc = -0.4 * angle;
        vel += acc * dt;
        vel *= 0.9987;
        angle += vel * dt * (180 / Math.PI) * 0.6;
        // clamp so it never flips over the top
        if (angle > 32)  { angle = 32;  vel = -Math.abs(vel); }
        if (angle < -32) { angle = -32; vel =  Math.abs(vel); }
      }
      last = ts;
      arm.setAttribute('transform', 'rotate(' + angle + ')');
      if (!stopped && Math.abs(angle) < 0.4 && Math.abs(vel) < 0.05) {
        stopped = true;
        document.body.classList.add('error-stopped'); // CSS fades in the egg
        return; // stop rAF
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();
</script>
